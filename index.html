<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e79">
  <title>Veille ISBN</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" href="vendor/fonts/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Liste, fiche et réglages : construits par app.js -->
  <div id="app"></div>

  <!-- Scanner plein écran (gardé dans la page pour ne pas couper la vidéo à chaque mise à jour) -->
  <div id="scanner" hidden>
    <video id="video" playsinline muted></video>
    <div id="cadre-zone" class="cadre-zone">
      <div id="cadre" class="cadre"></div>
      <div id="ligne-visee" class="ligne-visee"></div>
    </div>
    <div id="pile-boites"></div>
    <div id="flash" class="flash" hidden></div>

    <div class="scan-haut">
      <button id="btn-scan-fermer" class="scan-pastille">Annuler</button>
      <div id="kilo-compteur" class="kilo-compteur" hidden>
        <div id="kilo-n" class="kilo-n">0</div>
        <div id="kilo-libelle" class="kilo-libelle">scanné</div>
      </div>
    </div>

    <div id="scan-aide" class="scan-aide"></div>

    <div class="scan-bas">
      <div id="scan-dernier" class="scan-dernier" hidden>
        <div class="scan-dernier-txt">
          <div id="dernier-libelle" class="dernier-libelle"></div>
          <div id="dernier-isbn" class="mono dernier-isbn"></div>
        </div>
        <button id="btn-annuler-dernier" class="btn-contour-blanc">Annuler le dernier</button>
      </div>
      <div id="zoom-ligne" class="zoom-ligne" hidden>
        <span class="zoom-lib">Zoom</span>
        <input id="zoom" type="range" aria-label="Zoom">
        <span id="zoom-val" class="mono zoom-val">×1</span>
      </div>
      <div class="scan-outils">
        <button id="btn-torche" class="scan-outil">Torche</button>
        <button id="btn-photo" class="scan-outil">Photo</button>
        <button id="btn-isbn-clavier" class="scan-outil">Taper l'ISBN</button>
      </div>
      <button id="btn-kilo-terminer" class="btn-terminer" hidden></button>
    </div>
    <input id="fichier-photo" type="file" accept="image/*" capture="environment" hidden>
  </div>

  <div id="feuille"></div>
  <div id="toast" role="status" hidden></div>

  <script src="vendor/zxing.min.js"></script>
  <script src="config.js"></script>
  <script src="services.js"></script>
  <script src="scan.js"></script>
  <script src="app.js"></script>
</body>
</html>
